<div class="page-container">
    <h1 style="margin-bottom: 24px;">User Management</h1>

    <div class="table-container">
        <table class="user-table">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td>#{{ user.id }}</td>
                    <td class="username-cell">{{ user.name }}</td>
                    
                    <td><span class="role-badge">{{ user.role | titlecase }}</span></td>
                    
                    <td>
                        <span class="status-badge" [ngClass]="{'active': user.status === 'Active'}">
                            {{ user.status | titlecase }}
                        </span>
                    </td>
                    
                    <!-- 🌟 Updated Action Column -->
                    <td>
                        <button *ngIf="user.status !== 'Suspended'" class="btn-suspend" (click)="openConfirmModal(user, 'suspend')">
                            Suspend
                        </button>
                        <button *ngIf="user.status === 'Suspended'" class="btn-activate" (click)="openConfirmModal(user, 'activate')">
                            Resume
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 🌟 Dynamic Confirmation Modal Overlay -->
    <div class="modal-overlay" *ngIf="showModal">
        <div class="modal-content">
            <!-- Changes title based on action -->
            <h2>Confirm {{ modalAction === 'suspend' ? 'Suspension' : 'Activation' }}</h2>
            
            <p>Are you sure you want to {{ modalAction }} this account?</p>
            
            <div class="modal-actions">
                <button class="btn-cancel" (click)="closeModal()">Cancel</button>
                <button class="btn-confirm" (click)="confirmAction()">Yes</button>
            </div>
        </div>
    </div>
</div>
