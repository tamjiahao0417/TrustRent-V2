<div class="page-container" *ngIf="req">
    <a (click)="goBack()" class="back-link" style="cursor: pointer;">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
    <h1 class="page-title">Draft Legal Agreement</h1>
    <p class="page-subtitle">Fill in the details. Once submitted, it will be sent to the tenant for review and signature.</p>

    <div class="form-card">
        <form (submit)="onSubmit(); $event.preventDefault()">
            
            <div class="section-title">Parties Information</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Landlord Full Name</label>
                    <input type="text" [(ngModel)]="formData.landlord_name" name="l_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Landlord NRIC / Passport No.</label>
                    <input type="text" [(ngModel)]="formData.landlord_ic" name="l_ic" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label>Landlord Permanent Address</label>
                <input type="text" [(ngModel)]="formData.landlord_address" name="l_addr" class="form-control" required>
            </div>

            <div class="form-row mt-4">
                <div class="form-group">
                    <label>Tenant Full Name</label>
                    <input type="text" [(ngModel)]="formData.tenant_name" name="t_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Tenant NRIC / Passport No.</label>
                    <input type="text" [(ngModel)]="formData.tenant_ic" name="t_ic" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label>Tenant Permanent Address</label>
                <input type="text" [(ngModel)]="formData.tenant_address" name="t_addr" class="form-control" required>
            </div>

            <div class="section-title mt-5">Financials & Schedule</div>
            <div class="form-row">
                <div class="form-group"><label>Lease Start Date</label><input type="date" [(ngModel)]="formData.start_date" name="start" class="form-control" required></div>
                <div class="form-group"><label>Lease End Date</label><input type="date" [(ngModel)]="formData.end_date" name="end" class="form-control" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Monthly Rent (RM)</label><input type="number" [(ngModel)]="formData.rent_amount" name="rent" class="form-control" required></div>
                <div class="form-group"><label>Utilities Deposit (RM)</label><input type="number" [(ngModel)]="formData.utilities_deposit" name="u_dep" class="form-control" required></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Payment Frequency</label>
                    <select [(ngModel)]="formData.payment_frequency" name="freq" class="form-control">
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group"><label>Rent Due Date</label><input type="text" [(ngModel)]="formData.due_date" name="due" class="form-control" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Security Deposit (RM)</label><input type="number" [(ngModel)]="formData.security_deposit" name="s_dep" class="form-control" required></div>
                <div class="form-group"><label>Notice Period (Months)</label><input type="number" [(ngModel)]="formData.notice_period" name="notice" class="form-control" required></div>
            </div>

            <div class="section-title mt-5">Bank Details & Terms</div>
            <div class="form-group">
                <label>Additional Terms & Banking Info</label>
                <textarea [(ngModel)]="formData.additional_terms" name="terms" class="form-control" style="height: 120px;" required></textarea>
            </div>

            <div class="section-title mt-5">Landlord Digital Signature</div>
            <div class="signature-box">
                <canvas #signatureCanvas width="460" height="150" style="border: 1px dashed #d1d5db; border-radius: 8px; width: 100%; max-width: 460px; background: white;"></canvas>
                <br>
                <button type="button" class="btn-clear" (click)="clearSignature()">Clear Signature</button>
            </div>

            <div class="submit-container mt-4">
                <button type="submit" class="btn-submit">Sign & Send to Tenant</button>
            </div>
        </form>
    </div>
</div>
