<div class="page-container">
    <div class="header-actions">
        <h1 class="page-title">Issue Reported</h1>
        <button *ngIf="userRole !== 'admin'" routerLink="/reports/create" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Report
        </button>
    </div>

    <div class="controls-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search reports..." 
                   [(ngModel)]="searchQuery" (input)="applyFilters()">
        </div>
    </div>

    <div class="tabs-container">
        <button *ngFor="let tab of tabs" 
                (click)="setTab(tab)" 
                [class.active]="activeTab === tab" 
                class="tab-btn">
            {{ tab }}
        </button>
    </div>

    <div class="table-card">
        <table class="report-table">
            <thead>
                <tr>
                    <th>Report ID</th>
                    <th>Reported User</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="filteredReports.length === 0">
                    <td colspan="5" class="empty-state">No reports found.</td>
                </tr>
                <tr *ngFor="let report of filteredReports">
                    <td class="bold-text">{{ report.reference_id }}</td>
                    
                    <td class="bold-text">{{ report.related_user?.name || report.reporter?.name || 'System / General' }}</td>
                    
                    <td class="muted-text">{{ report.issue_type }}</td>
                    
                    <td>
                        <span class="status-pill" [ngClass]="report.status.toLowerCase().replace(' ', '-')">
                            {{ report.status }}
                        </span>
                    </td>
                    
                    <td class="text-right">
                        <a [routerLink]="['/reports/details', report.id]" class="action-link">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
