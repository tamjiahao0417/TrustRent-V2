<div class="page-container">
    
    <a routerLink="/my-properties" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Cancel Create
    </a>

    <div class="header-flex">
        <h1>Create New Property Listing</h1>
    </div>

    <div class="form-card">
        <form (ngSubmit)="onSubmit()" #propertyForm="ngForm">
            
            <div class="form-group">
                <label>Property Title (e.g., Cozy Studio Apartment)</label>
                <input type="text" name="title" [(ngModel)]="property.title" required placeholder="Enter property title">
            </div>

            <div class="form-group">
                <label>Property Description</label>
                <input type="text" name="description" [(ngModel)]="property.description" required placeholder="Describe the property...">
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label>Location (City/Area)</label>
                    <input type="text" name="location" [(ngModel)]="property.location" required placeholder="e.g., Downtown KL">
                </div>
                <div class="form-group">
                    <label>Rental Price (RM/month)</label>
                    <input type="number" name="price" [(ngModel)]="property.price" required placeholder="e.g., 1500">
                </div>
                <div class="form-group">
                    <label>Number of Rooms</label>
                    <input type="number" name="rooms" [(ngModel)]="property.rooms" required placeholder="e.g., 3">
                </div>
            </div>

            <div class="form-group">
                <label>Full Property Address</label>
                <input type="text" name="address" [(ngModel)]="property.address" required placeholder="Full address details...">
            </div>

            <div class="form-group">
                <label>Contact Phone Number</label>
                <input type="tel" name="phone_number" 
                       [(ngModel)]="property.phone_number" 
                       (keypress)="allowNumbersOnly($event)"
                       (input)="formatPhone()"
                       required 
                       placeholder="01X-XXXXXXX">
            </div>

            <div class="form-group">
                <label>Upload Property Image    s</label>
                <input type="file" class="file-input" (change)="onFileSelect($event)" accept="image/jpeg, image/png, image/webp" multiple>
                <small>You can select multiple images. Supported formats: JPG, PNG, WEBP. Max size: 5MB per image.</small>
                
                <div class="preview-container" *ngIf="previewUrls.length > 0">
                    <div class="preview-wrapper" *ngFor="let url of previewUrls; let i = index">
                        <img [src]="url" class="preview-image" alt="New Preview" (click)="openImage(url)">
                        <button type="button" class="remove-btn" (click)="removeImage(i)">&times;</button>
                    </div>
                </div>
            </div>

            <div class="image-modal" *ngIf="fullScreenImage" (click)="closeImage()">
                <span class="close-modal">&times;</span>
                
                <img [src]="fullScreenImage" alt="Full Screen" (click)="$event.stopPropagation()">
            </div>
            
            <div class="action-buttons">
                <button type="submit" class="btn-primary" [disabled]="!propertyForm.valid || isSubmitting">
                    {{ isSubmitting ? 'Listing...' : 'List Property' }}
                </button>
                <a routerLink="/my-properties" class="btn-secondary">Cancel</a>
            </div>
            
        </form>
    </div>
</div>
