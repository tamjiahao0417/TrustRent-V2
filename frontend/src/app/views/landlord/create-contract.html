<div class="page-container" *ngIf="req">
    <a (click)="goBack()" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Rental Request
    </a>

    <div class="header-titles" style="margin-bottom: 30px;">
        <h1 class="page-title">Draft Legal Agreement</h1>
        <p class="page-subtitle">Fill in the details. Once submitted, it will be sent to the tenant for review and signature.</p>
    </div>

    <div class="form-card">
        <form (submit)="onSubmit(); $event.preventDefault()">
            
            <h2 class="section-title">1. Parties Information</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Landlord Full Name</label>
                    <input type="text" [(ngModel)]="formData.landlord_name" name="l_name" required>
                </div>
                <div class="form-group">
                    <label>Landlord NRIC / Passport No.</label>
                    <input type="text" [(ngModel)]="formData.landlord_ic" name="l_ic" required>
                </div>
            </div>
            <div class="form-group">
                <label>Landlord Permanent Address</label>
                <input type="text" [(ngModel)]="formData.landlord_address" name="l_addr" required>
            </div>

            <div class="form-row mt-4">
                <div class="form-group">
                    <label>Tenant Full Name</label>
                    <input type="text" [(ngModel)]="formData.tenant_name" name="t_name" required>
                </div>
                <div class="form-group">
                    <label>Tenant NRIC / Passport No.</label>
                    <input type="text" [(ngModel)]="formData.tenant_ic" name="t_ic" required>
                </div>
            </div>
            <div class="form-group">
                <label>Tenant Permanent Address</label>
                <input type="text" [(ngModel)]="formData.tenant_address" name="t_addr" required>
            </div>

            <h2 class="section-title mt-5">2. Financials & Schedule</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Lease Start Date</label>
                    <input type="date" [(ngModel)]="formData.start_date" name="start" required>
                </div>
                <div class="form-group">
                    <label>Lease End Date</label>
                    <input type="date" [(ngModel)]="formData.end_date" name="end" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Monthly Rent (RM)</label>
                    <input type="number" [(ngModel)]="formData.rent_amount" name="rent" required>
                </div>
                <div class="form-group">
                    <label>Utilities Deposit (RM)</label>
                    <input type="number" [(ngModel)]="formData.utilities_deposit" name="u_dep" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Payment Frequency</label>
                    <select [(ngModel)]="formData.payment_frequency" name="freq" class="premium-select">
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Rent Due Date</label>
                    <input type="text" [(ngModel)]="formData.due_date" name="due" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Security Deposit (RM)</label>
                    <input type="number" [(ngModel)]="formData.security_deposit" name="s_dep" required>
                </div>
                <div class="form-group">
                    <label>Notice Period (Months)</label>
                    <input type="number" [(ngModel)]="formData.notice_period" name="notice" required>
                </div>
            </div>

            <h2 class="section-title mt-5">3. Terms</h2>
            <div class="form-group">
                <label>Additional Terms</label>
                <textarea [(ngModel)]="formData.additional_terms" name="terms" style="height: 120px;" required></textarea>
            </div>

            <h2 class="section-title mt-5">4. Landlord Digital Signature</h2>
            <div class="signature-box">
                <canvas #signatureCanvas width="460" height="150"></canvas>
                <div class="signature-actions">
                    <button type="button" class="btn-clear" (click)="clearSignature()">
                        <i class="fa-solid fa-rotate-right"></i> Clear Signature
                    </button>
                </div>
            </div>

            <div class="action-buttons mt-4">
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-file-signature"></i> Sign & Send to Tenant
                </button>
            </div>
        </form>
    </div>
</div>
