<div class="page-container" *ngIf="property">
    <a [routerLink]="['/properties/view', propertyId]" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Cancel Edit
    </a>

    <div class="header-row">
        <h1>Edit Property: {{ property.title }}</h1>
    </div>

    <form class="property-form" (ngSubmit)="updateProperty()">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" [(ngModel)]="property.title" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" [(ngModel)]="property.description" rows="4" required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Location / City</label>
                <input type="text" name="location" [(ngModel)]="property.location" required>
            </div>
            <div class="form-group">
                <label>Total Rooms</label>
                <input type="number" name="rooms" [(ngModel)]="property.rooms" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Price (RM per month)</label>
                <input type="number" name="price" [(ngModel)]="property.price" required>
            </div>
            <div class="form-group">
                <label>Contact Phone</label>
                <input type="tel" name="phone_number" [(ngModel)]="property.phone_number" required>
            </div>
        </div>

        <div class="form-group">
            <label>Full Address</label>
            <input type="text" name="address" [(ngModel)]="property.address" required>
        </div>

        <div class="form-group">
            <label>Property Photos</label>
            <input type="file" class="file-input" (change)="onFileSelect($event)" multiple accept="image/jpeg, image/png, image/webp">
            <small class="text-muted">You can remove current photos and upload new ones. Max size: 5MB per image.</small>
            
            <div class="preview-container" *ngIf="existingImages.length > 0 || previewUrls.length > 0">
                <div class="preview-wrapper" *ngFor="let img of existingImages; let i = index">
                    <img [src]="'http://localhost:8000/uploads/' + img" class="preview-image" alt="Current Image" (click)="openImage('http://localhost:8000/uploads/' + img)">
                    <button type="button" class="remove-btn" (click)="removeExistingImage(i)">&times;</button>
                </div>

                <div class="preview-wrapper" *ngFor="let url of previewUrls; let i = index">
                    <img [src]="url" class="preview-image" alt="New Preview" (click)="openImage(url)">
                    <button type="button" class="remove-btn" (click)="removeImage(i)">&times;</button>
                </div>
            </div>
        </div>

        <div class="image-modal" *ngIf="fullScreenImage" (click)="closeImage()">
            <span class="close-modal">&times;</span>
            
            <img [src]="fullScreenImage" alt="Full Screen" (click)="$event.stopPropagation()">
        </div>
        
        <button type="submit" class="btn-submit">Save Changes</button>
    </form>
</div>
