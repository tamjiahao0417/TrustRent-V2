<div class="profile-layout">
    <div class="profile-form-card">
        <div class="card-header">
            <div>
                <h2>Profile Information</h2>
                <p>Update your account's profile information and wallet address.</p>
            </div>
            <button *ngIf="!isEditing" class="btn-black" (click)="toggleEdit(true)">Edit</button>
        </div>

        <form class="settings-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" [(ngModel)]="user.name" [readonly]="!isEditing">
            </div>

            <div class="form-group">
                <label>NRIC Number</label>
                <input type="text" name="ic" [(ngModel)]="user.ic" (input)="formatIC()" [readonly]="!isEditing">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" [(ngModel)]="user.email" [readonly]="!isEditing">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_number" 
                       [(ngModel)]="user.phone_number" 
                       (keypress)="allowNumbersOnly($event)"
                       (input)="formatPhone()" 
                       [readonly]="!isEditing"
                       placeholder="01X-XXXXXXX">
            </div>

            <div class="form-group">
                <label>House Address</label>
                <input type="text" name="house_address" [(ngModel)]="user.house_address" [readonly]="!isEditing">
            </div>

            <div class="form-group">
                <label>Wallet Address (Web3)</label>
                <input type="text" name="wallet_address" [(ngModel)]="user.wallet_address" [readonly]="!isEditing">
            </div>

            <div class="action-buttons" *ngIf="isEditing">
                <button type="button" class="btn-black" (click)="saveProfile()">Save Changes</button>
                <button type="button" class="btn-outline" (click)="toggleEdit(false)">Cancel</button>
            </div>
        </form>
    </div>

    <div class="profile-summary-card">
        <div class="big-profile-pic">
            {{ user.name?.[0] | uppercase }}
        </div>
        <h3>{{ user.name }}</h3>
        <p class="text-muted">{{ user.email }}</p>
        
        <div class="role-badge">{{ (user.role || 'Landlord') | titlecase }}</div>
        
        <div class="divider"></div>

        <div class="summary-details">
            <div class="detail-row">
                <i class="fa-regular fa-calendar"></i>
                <span>Joined recently</span>
            </div>
            <div class="detail-row">
                <i class="fa-solid fa-wallet"></i>
                <span>{{ user.wallet_address ? 'Wallet Connected' : 'No Wallet' }}</span>
            </div>
        </div>
    </div>
</div>
