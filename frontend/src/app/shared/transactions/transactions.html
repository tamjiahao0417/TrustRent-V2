<div class="page-container">
    <div class="header-actions">
        <h1 class="page-title">Transactions</h1>
        <button class="btn-light">Export</button>
    </div>

    <div class="controls-container" style="margin-bottom: 30px;">
        <div class="search-box" style="display: flex; align-items: center; background: #ffffff; padding: 12px 16px; border-radius: 8px; border: 1px solid #e5e7eb;">
            <i class="fa-solid fa-magnifying-glass" style="color: #9ca3af; margin-right: 12px;"></i>
            <input type="text" placeholder="Search by type, status, or amount..." 
                   [(ngModel)]="searchQuery" (input)="filterTransactions()"
                   style="border: none; background: transparent; width: 100%; outline: none; font-size: 15px;">
        </div>
    </div>

    <app-loading-spinner *ngIf="isLoading" message="Loading your transaction history..."></app-loading-spinner>

    <ng-container *ngIf="!isLoading">
        <div class="table-card">
            <table class="contract-table">
                <thead>
                    <tr><th>Date</th><th>Amount</th><th>Type</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr *ngIf="transactions.length === 0">
                        <td colspan="5" class="empty-state">You have no transactions yet.</td>
                    </tr>
                    <tr *ngIf="transactions.length > 0 && filteredTransactions.length === 0">
                        <td colspan="5" class="empty-state">No transactions match your search.</td>
                    </tr>
                    
                    <tr *ngFor="let tx of filteredTransactions">
                        <td>{{ tx.created_at | date:'MM/dd/yyyy' }}</td>
                        <td style="color:#6b7280; font-weight: 600;">RM {{ tx.amount | number:'1.2-2' }}</td>
                        <td style="color:#9ca3af;">{{ tx.type }}</td>
                        <td><span class="status-pill">{{ tx.status }}</span></td>
                        <td><a [routerLink]="['/transactions/details', tx.id]" class="action-link">View</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </ng-container>
</div>
