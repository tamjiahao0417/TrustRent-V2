<div class="page-container">
    <a (click)="goBack()" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Cancel Edit</a>
    <h1 class="page-title">Edit Maintenance Issue</h1>

    <div class="form-card">
        <form (ngSubmit)="submitUpdate()">

            <div class="form-group">
                <label>Select Property</label>
                <select [(ngModel)]="reportData.selected_property" name="property" class="form-control" required>
                    <option value="" disabled>Choose a property</option>
                    <option *ngFor="let prop of activeProperties" [ngValue]="prop">
                        {{ prop.address }}
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Issue Description</label>
                <textarea [(ngModel)]="reportData.description" name="description" class="form-control" rows="5" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select [(ngModel)]="reportData.category" name="category" class="form-control" required>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Structural">Structural</option>
                        <option value="Appliance">Appliance</option>
                        <option value="HVAC">HVAC</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Urgency</label>
                    <select [(ngModel)]="reportData.urgency" name="urgency" class="form-control" required>
                        <option value="Low">Low - Not urgent</option>
                        <option value="Medium">Medium - Needs attention soon</option>
                        <option value="High">High - Urgent / Safety concern</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Current Media</label>
                <div class="preview-container" *ngIf="existingMedia.length > 0">
                    <div class="preview-wrapper" *ngFor="let mediaUrl of existingMedia; let i = index">
                        <img *ngIf="!isVideo(mediaUrl)" [src]="mediaUrl" class="preview-image" (click)="openImage(mediaUrl)">
                        <video *ngIf="isVideo(mediaUrl)" [src]="mediaUrl" class="preview-image video-preview" controls></video>
                        <button type="button" class="remove-btn" (click)="removeExistingImage(i)">&times;</button>
                    </div>
                </div>
                <p *ngIf="existingMedia.length === 0" class="help-text">No existing media.</p>
            </div>

            <div class="form-group">
                <label>Add New Photos or Videos (Optional)</label>
                <input type="file" class="form-control file-input" (change)="onFileSelected($event)" accept="image/*,video/*" multiple>
                
                <div class="preview-container" *ngIf="previewMedia.length > 0">
                    <div class="preview-wrapper" *ngFor="let media of previewMedia; let i = index">
                        <img *ngIf="media.type.startsWith('image')" [src]="media.url" class="preview-image" (click)="openImage(media.url)">
                        <video *ngIf="media.type.startsWith('video')" [src]="media.url" class="preview-image video-preview" controls></video>
                        <button type="button" class="remove-btn" (click)="removeNewImage(i)">&times;</button>
                    </div>
                </div>
            </div>

            <div class="image-modal" *ngIf="fullScreenImage" (click)="closeImage()">
                <span class="close-modal">&times;</span>
                <img [src]="fullScreenImage" alt="Full Screen" (click)="$event.stopPropagation()">
            </div>

            <div class="submit-area">
                <button type="submit" class="btn-primary" [disabled]="isLoading">
                    <i class="fa-solid fa-circle-notch fa-spin" *ngIf="isLoading" style="margin-right: 8px;"></i>
                    {{ isLoading ? 'Saving...' : 'Save Changes' }}
                </button>
            </div>
            
        </form>
    </div>
</div>
