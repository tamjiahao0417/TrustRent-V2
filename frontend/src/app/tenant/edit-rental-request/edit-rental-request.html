<div class="page-container">
    <a (click)="goBack()" class="back-link" style="cursor: pointer;">
        <i class="fa-solid fa-arrow-left"></i> Cancel
    </a>

    <h1 class="page-title">Edit Request</h1>

    <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
    </div>

    <div class="form-card" *ngIf="requestDetails">
        <form (submit)="onSubmit($event)">

            <div class="form-group">
                <label>Start date</label>
                <input type="date" name="start_date" [(ngModel)]="startDate" [min]="minDate" class="form-control" required>
            </div>

            <div class="form-group">
                <label>End date</label>
                <input type="date" name="end_date" [(ngModel)]="endDate" [min]="minDate" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Move-in date</label>
                <input type="date" name="move_in_date" [(ngModel)]="moveInDate" [min]="minDate" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Notes (optional)</label>
                <textarea name="notes" [(ngModel)]="notes" class="form-control" placeholder="Any special requests or details for the landlord..."></textarea>
            </div>

            <div class="submit-container">
                <button type="submit" class="btn-submit">Update</button>
            </div>
        </form>
    </div>
</div>
